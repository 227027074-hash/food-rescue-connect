<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pickup Requests | Food Rescue Connect</title><link rel="stylesheet" href="css/style.css">
<script defer src="js/storage.js"></script><script defer src="js/common.js"></script><script defer src="js/requests.js"></script></head>
<body><header id="site-header"></header><main class="container section"><div class="section-heading"><span class="eyebrow">PICKUP MANAGEMENT</span><h1>Pickup requests</h1><p>Review requests and update collection progress.</p></div>
<div class="notice">Log in as an NGO to request food, or as a donor to review requests. Status changes are saved in this browser.</div>
<div class="filters"><div><label for="request-filter">Filter by status</label><select id="request-filter"><option value="">All statuses</option><option>Pending</option><option>Accepted</option><option>Rejected</option><option>Picked Up</option><option>Completed</option></select></div></div>
<div id="requests-list" class="table-wrap"></div><p id="requests-empty" class="empty-state hidden">No pickup requests found.</p><p id="requests-message" class="form-message" role="status"></p></main><footer id="site-footer"></footer></body></html>
