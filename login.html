<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Demo Login | Food Rescue Connect</title><link rel="stylesheet" href="css/style.css">
<script defer src="js/storage.js"></script><script defer src="js/common.js"></script><script defer src="js/auth.js"></script></head>
<body><header id="site-header"></header><main class="container section narrow"><div class="form-card">
<span class="eyebrow">WELCOME BACK</span><h1>Demo Login</h1><p>Sign in to explore your role-specific dashboard.</p>
<div class="notice">Prototype only: this login is not secure authentication.</div>
<form id="login-form"><label for="login-email">Email address</label><input id="login-email" type="email" required placeholder="you@example.com">
<label for="login-password">Password</label><input id="login-password" type="password" required>
<label for="login-role">Login as</label><select id="login-role" required><option value="">Choose a role</option><option>Donor</option><option>NGO</option><option>Admin</option></select>
<button class="btn full" type="submit">Login</button><p id="login-message" class="form-message" role="status"></p></form>
<div class="demo-credentials"><strong>Demo accounts</strong><p>Donor: donor1@demo.com / demo123</p><p>NGO: ngo1@demo.com / demo123</p><p>Admin: admin@demo.com / admin123</p></div>
<p>New user? <a href="register.html">Register here</a></p></div></main><footer id="site-footer"></footer></body></html>
